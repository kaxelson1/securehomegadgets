name: AI Content Generation & YouTube Shorts

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8 AM UTC
  workflow_dispatch: []

jobs:
  generate-content:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Plan topics
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run plan:topics -- "home security gadgets"

      - name: Generate article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          # Parse plan.json and extract first keyword
          KEYWORD=$(node -e "console.log(JSON.parse(require('fs').readFileSync('./scripts/plan.json')).topics[0].keyword)")
          npm run generate:content -- "$KEYWORD"

      - name: Generate YouTube shorts scripts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Extract article slug from generated files
          SLUG=$(ls -t src/content/articles/*.md | head -1 | xargs basename -s .md)
          npm run generate:shorts -- "$SLUG"

      - name: Commit and push content
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/articles/*.md
          git add src/content/shorts/*.json
          git add scripts/plan.json
          git diff --cached --quiet || (git commit -m "chore: AI-generated home security content" && git push)

  # Optional: Send approval notification
  notify-approval:
    needs: generate-content
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify for approval
        run: |
          echo "✓ New YouTube Shorts pending approval"
          echo "Review at: https://github.com/${{ github.repository }}/src/content/shorts"
