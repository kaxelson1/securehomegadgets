- name: Push auto/seo-build branch
  env:
    PAT: ${{ secrets.COPILOT_SERVICE_PAT }}
  run: |
    git config user.name "automation-bot"
    git config user.email "actions@github.com"
    git remote set-url origin https://x-access-token:${PAT}@github.com/kaxelson1/securehomegadgets.git
    git checkout -b auto/seo-build
    # copy files into repo workspace or ensure they are present
    git add .
    git commit -m "auto/seo-build: add SEO templates, sitemap, robots.txt, CI" || echo "no changes to commit"
    git push origin auto/seo-build --force
