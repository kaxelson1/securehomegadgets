name: YouTube Upload Test

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  youtube-test:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COPILOT_SERVICE_PAT }}

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl

      - name: Exchange refresh token for access token
        id: token
        run: |
          set -euo pipefail
          resp=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="${YT_CLIENT_ID}" \
            -d client_secret="${YT_CLIENT_SECRET}" \
            -d refresh_token="${YT_REFRESH_TOKEN}" \
            -d grant_type=refresh_token)
          access_token=$(echo "$resp" | jq -r .access_token)
          if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
            echo "Token exchange failed: $resp"
            exit 1
          fi
          echo "access_token=${access_token}" >> $GITHUB_ENV
          echo "token_response=$(echo "$resp" | jq -c .)" >> $GITHUB_OUTPUT

      - name: Show token info (sanitized)
        run: |
          ACCESS_TOKEN="${{ env.access_token }}"
          curl -s -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://www.googleapis.com/oauth2/v3/tokeninfo?access_token=${ACCESS_TOKEN}" | jq -r .

      - name: Prepare test video
        run: |
          # Create a tiny test file if none exists. Replace with your real test file path.
          mkdir -p public
          if [ ! -f public/test-video.mp4 ]; then
            # create a small silent MP4 (requires ffmpeg). If ffmpeg not available, create a placeholder text file.
            if command -v ffmpeg >/dev/null 2>&1; then
              ffmpeg -f lavfi -i color=c=black:s=320x240:d=1 -f lavfi -i anullsrc -shortest -c:v libx264 -c:a aac public/test-video.mp4 -y
            else
              echo "test video placeholder" > public/test-video.txt
            fi
          fi

      - name: Run upload script (private test)
        env:
          ACCESS_TOKEN: ${{ env.access_token }}
        run: |
          set -euo pipefail

          echo "=== STEP 1: Build metadata JSON ==="
          metadata='{
            "snippet": {
              "title": "CI test upload",
              "description": "Private test upload from GitHub Actions",
              "tags": ["ci","test"]
            },
            "status": {
              "privacyStatus": "private"
            }
          }'

          echo "Metadata JSON:"
          echo "$metadata" | jq .

          echo "=== STEP 2: Start resumable upload session ==="
          response_headers=$(mktemp)

          curl -s -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -H "X-Upload-Content-Type: video/mp4" \
            -d "${metadata}" \
            -D "$response_headers" \
            -o /dev/null \
            "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status"

          echo "Response headers:"
          cat "$response_headers"

          session_url=$(grep -i "^Location:" "$response_headers" | awk '{print $2}' | tr -d '\r')

          if [ -z "$session_url" ]; then
            echo "❌ ERROR: Google did not return a resumable upload session URL."
            echo "This ALWAYS means one of the following:"
            echo "  1) Missing scope (must include youtube.upload)"
            echo "  2) OAuth app not authorized for this user (Test User missing)"
            echo "  3) YouTube Data API v3 not enabled"
            exit 1
          fi

          echo "Session URL:"
          echo "$session_url"

          echo "=== STEP 3: Upload video file ==="
          if [ ! -f ./public/test-video.mp4 ]; then
            echo "❌ ERROR: test-video.mp4 not found."
            exit 1
          fi

          upload_response=$(curl -s -X PUT \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: video/mp4" \
            --data-binary @./public/test-video.mp4 \
            "$session_url")

          echo "Upload response:"
          echo "$upload_response" | jq .

          echo "=== STEP 4: Extract videoId (if present) ==="
          video_id=$(echo "$upload_response" | jq -r '.id // empty')

          if [ -z "$video_id" ]; then
            echo "⚠️ Upload completed but no videoId returned."
          else
            echo "🎉 SUCCESS — Uploaded videoId: $video_id"
          fi
          
      - name: Post-run cleanup and summary
        run: |
          echo "Upload test completed. Check previous steps for token exchange and upload response."
