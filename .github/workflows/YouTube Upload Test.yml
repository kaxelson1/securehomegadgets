name: YouTube Upload Test

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  youtube-test:
    runs-on: ubuntu-latest

    env:
      YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COPILOT_SERVICE_PAT }}

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl ffmpeg

      - name: Exchange refresh token for access token
        id: token
        run: |
          set -euo pipefail
          resp=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="${YT_CLIENT_ID}" \
            -d client_secret="${YT_CLIENT_SECRET}" \
            -d refresh_token="${YT_REFRESH_TOKEN}" \
            -d grant_type=refresh_token)

          echo "Raw token response:"
          echo "$resp" | jq .

          access_token=$(echo "$resp" | jq -r .access_token)
          if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
            echo "❌ Token exchange failed."
            exit 1
          fi

          echo "access_token=${access_token}" >> $GITHUB_ENV
          echo "token_response=$(echo "$resp" | jq -c .)" >> $GITHUB_OUTPUT

      - name: Verify token scopes
        run: |
          set -euo pipefail
          ACCESS_TOKEN="${{ env.access_token }}"
          echo "Token info:"
          curl -s -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://www.googleapis.com/oauth2/v3/tokeninfo?access_token=${ACCESS_TOKEN}" | jq -r .

      - name: Prepare test video
        run: |
          set -euo pipefail
          mkdir -p public
          ffmpeg -f lavfi -i color=c=black:s=320x240:d=1 \
                 -f lavfi -i anullsrc \
                 -shortest \
                 -c:v libx264 -c:a aac \
                 public/test-video.mp4 -y
          ls -lh public

      - name: Run upload script (private test)
        env:
          ACCESS_TOKEN: ${{ env.access_token }}
        run: |
          set -euo pipefail

          echo "=== STEP 1: Build metadata JSON ==="
          metadata='{
            "snippet": {
              "title": "CI test upload",
              "description": "Private test upload from GitHub Actions",
              "tags": ["ci","test"]
            },
            "status": {
              "privacyStatus": "private"
            }
          }'

          echo "$metadata" | jq .

          echo "=== STEP 2: Start resumable upload session ==="
          headers_file=$(mktemp)

          curl -s -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -H "X-Upload-Content-Type: video/mp4" \
            -d "${metadata}" \
            -D "$headers_file" \
            -o /dev/null \
            "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status"

          echo "Response headers:"
          cat "$headers_file"

          session_url=$(grep -i "^Location:" "$headers_file" | awk '{print $2}' | tr -d '\r')

          if [ -z "$session_url" ]; then
            echo "❌ ERROR: No resumable upload session URL returned."
            exit 1
          fi

          echo "Session URL: $session_url"

          echo "=== STEP 3: Upload video file ==="
          if [ ! -f ./public/test-video.mp4 ]; then
            echo "❌ ERROR: public/test-video.mp4 not found."
            exit 1
          fi

          upload_response=$(curl -s -X PUT \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: video/mp4" \
            --data-binary @./public/test-video.mp4 \
            "$session_url")

          echo "Upload response:"
          echo "$upload_response" | jq .

          video_id=$(echo "$upload_response" | jq -r '.id // empty')

          if [ -z "$video_id" ]; then
            echo "⚠️ Upload completed but no videoId returned."
          else
            echo "🎉 SUCCESS — Uploaded videoId: $video_id"
          fi

      - name: Summary
        run: |
          echo "YouTube upload test workflow completed."
