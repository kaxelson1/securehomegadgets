name: YouTube Upload Test

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  youtube-test:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COPILOT_SERVICE_PAT }}

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl

      - name: Exchange refresh token for access token
        id: token
        run: |
          set -euo pipefail
          resp=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="${YT_CLIENT_ID}" \
            -d client_secret="${YT_CLIENT_SECRET}" \
            -d refresh_token="${YT_REFRESH_TOKEN}" \
            -d grant_type=refresh_token)
          access_token=$(echo "$resp" | jq -r .access_token)
          if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
            echo "Token exchange failed: $resp"
            exit 1
          fi
          echo "access_token=${access_token}" >> $GITHUB_ENV
          echo "token_response=$(echo "$resp" | jq -c .)" >> $GITHUB_OUTPUT

      - name: Show token info (sanitized)
        run: |
          ACCESS_TOKEN="${{ env.access_token }}"
          curl -s -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://www.googleapis.com/oauth2/v3/tokeninfo?access_token=${ACCESS_TOKEN}" | jq -r .

      - name: Prepare test video
        run: |
          # Create a tiny test file if none exists. Replace with your real test file path.
          mkdir -p public
          if [ ! -f public/test-video.mp4 ]; then
            # create a small silent MP4 (requires ffmpeg). If ffmpeg not available, create a placeholder text file.
            if command -v ffmpeg >/dev/null 2>&1; then
              ffmpeg -f lavfi -i color=c=black:s=320x240:d=1 -f lavfi -i anullsrc -shortest -c:v libx264 -c:a aac public/test-video.mp4 -y
            else
              echo "test video placeholder" > public/test-video.txt
            fi
          fi

      - name: Run upload script (private test)
        env:
          ACCESS_TOKEN: ${{ env.access_token }}
        run: |
          set -euo pipefail
          # Preferred: use your repo script that accepts an access token.
          if [ -x ./scripts/upload_to_youtube.sh ]; then
            ./scripts/upload_to_youtube.sh --access-token "${ACCESS_TOKEN}" --file ./public/test-video.mp4 --title "CI test upload" --privacyStatus "private"
          else
            # Minimal resumable upload example (replace metadata as needed).
            # 1) Start a resumable session
            metadata='{"snippet":{"title":"CI test upload","description":"Private test upload from Actions","tags":["ci","test"]},"status":{"privacyStatus":"private"}}'
            session_url=$(curl -s -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -H "X-Upload-Content-Type: video/*" \
              -d "${metadata}" \
              "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status" -D - | awk '/^Location: /{print $2}' | tr -d '\r')
            if [ -z "$session_url" ]; then
              echo "Failed to obtain upload session URL"
              exit 1
            fi
            # 2) Upload the file (simple single-chunk)
            if [ -f ./public/test-video.mp4 ]; then
              curl -s -X PUT -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: video/mp4" --data-binary @./public/test-video.mp4 "$session_url" | jq -r .
            else
              echo "No test video found to upload; created placeholder. Skipping upload."
            fi
          fi

      - name: Post-run cleanup and summary
        run: |
          echo "Upload test completed. Check previous steps for token exchange and upload response."
